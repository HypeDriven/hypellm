[package]
name = "hypellm-router"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "HypeLLM Router: inference listener, request pipeline, startup and shutdown orchestration."

[lints]
workspace = true

[lib]
name = "hypellm_router"
path = "src/lib.rs"

[[bin]]
name = "hypellm-router"
path = "src/main.rs"

[features]
# Test scaffolding — fixtures, fakes, and temporary directories — that uses
# `expect` and fixed keys, which specification 18.2 permits in tests and
# nowhere else. Off by default so it is not part of the library a non-test
# consumer sees.
test-harness = ["hypellm-store/test-harness", "hypellm-telemetry/test-harness", "hypellm-adapters/test-harness"]

[dependencies]
hypellm-adapters = { path = "../hypellm-adapters" }
hypellm-admin-api = { path = "../hypellm-admin-api" }
hypellm-auth = { path = "../hypellm-auth" }
hypellm-config = { path = "../hypellm-config" }
hypellm-core = { path = "../hypellm-core" }
hypellm-fleet = { path = "../hypellm-fleet" }
hypellm-crypto = { path = "../hypellm-crypto" }
hypellm-net = { path = "../hypellm-net" }
hypellm-store = { path = "../hypellm-store" }
hypellm-telemetry = { path = "../hypellm-telemetry" }
wire-http1 = { path = "../wire-http1" }
wire-json = { path = "../wire-json" }
wire-sse = { path = "../wire-sse" }

[dev-dependencies]
hypellm-router = { path = ".", features = ["test-harness"] }
hypellm-test-corpus = { path = "../hypellm-test-corpus" }
# The simulated fleet agent and `TempDir`, both behind `test-harness`
# (specification 18.2). The fleet integration suite needs a conformant agent on
# a real socket; `cargo test --workspace --offline` must still reach neither SSH
# nor Docker.
hypellm-net = { path = "../hypellm-net", features = ["test-harness"] }
hypellm-store = { path = "../hypellm-store", features = ["test-harness"] }
