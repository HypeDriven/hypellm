[package]
name = "hypellm-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Framed append-only log, snapshots, atomic activation, audit chain."

[lints]
workspace = true

[features]
# Test scaffolding — fixtures, fakes, and temporary directories — that uses
# `expect` and fixed keys, which specification 18.2 permits in tests and
# nowhere else. Off by default so it is not part of the library a non-test
# consumer sees.
test-harness = []

[dependencies]
hypellm-core = { path = "../hypellm-core" }
hypellm-crypto = { path = "../hypellm-crypto" }
wire-json = { path = "../wire-json" }

# The fuzz mutation engine (specification 21). Dev-only, and the corpus
# declares no dependencies of its own.
[dev-dependencies]
hypellm-store = { path = ".", features = ["test-harness"] }
hypellm-test-corpus = { path = "../hypellm-test-corpus" }
