[package]
name = "hypellm-telemetry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Bounded structured logs, counters, histograms, text exposition."

[lints]
workspace = true

[features]
# Test scaffolding — fixtures, fakes, and temporary directories — that uses
# `expect` and fixed keys, which specification 18.2 permits in tests and
# nowhere else. Off by default so it is not part of the library a non-test
# consumer sees.
test-harness = []

[dependencies]
hypellm-core = { path = "../hypellm-core" }
hypellm-crypto = { path = "../hypellm-crypto" }
wire-json = { path = "../wire-json" }

[dev-dependencies]
hypellm-telemetry = { path = ".", features = ["test-harness"] }
