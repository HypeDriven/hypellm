# HypeLLM Router — local container profile.
#
# The router shares a pod with a Tailscale node (`k8s/hypellm.yaml`), so this
# file decides which of the three listeners the tailnet can reach. The pod's
# network namespace has three interfaces:
#
#   lo          127.0.0.1
#   eth0        the pod IP
#   tailscale0  100.64.x.x     assigned by the tailnet
#
# A listener bound to 0.0.0.0 accepts on all three, including the tailnet, which
# is what inference does. Management and metrics bind 127.0.0.1, so a tailnet
# peer finds nothing listening for them. That is the whole mechanism, and it
# fails closed: it does not depend on a Tailscale ACL, on `--shields-up`, or on
# a firewall rule written somewhere else.
#
# This file deliberately names no pod address. A policy published through the
# management API snapshots this text and the router resumes it on restart, so
# an address that is only true of one pod would fail to bind in the next one.
# Two relay containers in the pod (`k8s/hypellm.yaml`) carry the pod IP's
# :18001 and :18002 to loopback for the host's published ports
# (`k8s/publish.yaml`); the pod IP lives only in that manifest.
#
# The one deliberate exception is the admin SPA, which the sidecar proxies at
# https://hypellm-router.tail29ea61.ts.net/ (`docker/tailscale-serve.json`).
# That proxy is tailscaled connecting to 127.0.0.1:18001 from inside this
# namespace; the listener itself is still not bound on `tailscale0`.
#
# This is a development document. It terminates no TLS of its own, declares no
# OIDC, and grants one tenant everything — see spec/deployment.html for what a
# single secure node requires instead.
#
# `cors_origins` lists both spellings of the host deliberately. A browser sends
# `Origin` on a same-origin POST too, the allowlist is compared exactly — no
# host equivalence, no scheme coercion — and `localhost` is not `127.0.0.1`.
# With only one of them listed, opening the admin application by the other name
# loads the page and then fails every mutating call with `origin_not_permitted`.
# The third is the tailnet name the sidecar serves the SPA under; it changes if
# the node joins another tailnet or takes another hostname (`just tailnet`).
#
# `fleet_enroll_url` is the same tailnet origin, for enrolling slaves
# (specification 26.8): the Fleet screen mints `curl -fsSL <it>/fleet/v1/install.sh
# | sh -s -- …`, and the new machine fetches the script and registers over this
# HTTPS proxy. Everything after that is direct LAN. Minting also needs the
# `fleet_agent` record to declare the agent's `ssh_public_key`; until one does,
# the endpoints answer but no token can be issued.

# `backup_dir` is run/backups/current on the node. The `backup` CronJob
# (k8s/backup.yaml) asks the router for a backup there nightly over the control
# socket, then archives it to run/backups/archive/<timestamp>, keeping 14.
#
# `default_deadline_ms` and `retry_budget_ms` are both raised because the effective
# budget is the LOWER of the two (`overall = deadline.min(retry_budget)`), so the
# shipped 30s retry budget capped every request at 30s regardless of the 120s
# deadline. Composing a whole dashboard is a single completion of two to four
# minutes and returned 504 at exactly 30s; clients carry their own, shorter budget.
#
# 300s was still short of the client that asks for the most. Measured over 39 real
# dashboard-design completions on the Q4 fleet, 3 died here as `deadline_exceeded`
# at ~305s while dashboard-service was configured to wait 600s — so its budget was
# fiction and the longest designs could never finish. Successful designs reached
# 185s and 234s, which is close enough to 300s that the ceiling was being hit on
# ordinary work rather than on a pathological prompt. Both values now match the
# 600s that service asks for; raising only one would restore the same bug, because
# the effective budget is still the lower of the two.

# Raised again to 1,200,000 on 2026-10-21. YuE2 and MiniMax-H3 jobs share both Sparks' GPUs,
# and while one runs Qwen generates at 3-10 tokens/s instead of ~20: the harness's longest real
# replies (~5-6k tokens) then outlast 600 s and were cut as deadline_exceeded at 5,475 and 6,088
# tokens. The harness caps a reply at 8,192 tokens, so 1,200 s bounds a looping reply as well.

# `weighted_tie_break` matters once the two Sparks share a rank (see the binding
# below). `Candidate::ordering_key` falls back to the target id on an exact score
# tie, and `spark-ef2f-q8kp:qwen38` sorts before `spark-q8kp:qwen38`, so with both machines
# idle every request would still land on the first one. The jitter is derived from
# the request id, so it spreads the idle case without costing determinism: the same
# request against the same snapshot and live state still ranks identically.

settings inference_listen=0.0.0.0:18000 \
         admin_listen=127.0.0.1:18001 \
         metrics_listen=127.0.0.1:18002 \
         state_dir=/var/lib/hypellm \
         backup_dir=/var/backups/hypellm/current \
         tls_helper_socket=/run/hypellm-tls/tls.sock \
         default_deadline_ms=1200000 \
         retry_budget_ms=1200000 \
         queue_timeout_ms=300000 \
         weighted_tie_break=true \
         cors_origins=http://localhost:18001,http://127.0.0.1:18001,https://hypellm-router.tail29ea61.ts.net \
         fleet_enroll_url=https://hypellm-router.tail29ea61.ts.net \
         break_glass_principal=operator \
         break_glass_tenant=local \
         break_glass_ttl_secs=3600 \
         anonymous_principal=svc:public \
         anonymous_tenant=local \
         anonymous_scopes=inference,models \
         job_workers=8 \
         job_retention_ms=7200000

# `job_workers` turns on POST /v1/jobs for the generative services below. An
# artifact job holds its worker while it polls its shim, so eight is what lets
# all six shims run at once with room for chat jobs. `job_retention_ms` is also
# a job's patience (the larger of it and `default_deadline_ms`): two hours, since
# a YuE2 job queues in ComfyUI behind the Iron Curtain runner's prompts.

# --- Google sign-in (optional, off) ---------------------------------------
#
# Nothing above configures OIDC, so `POST /admin/v1/auth/google/start` answers
# `not_found` and the sign-in screen falls back to break-glass. That is the
# supported local profile, not a misconfiguration.
#
# To turn it on, add these to the `settings` record above and start the
# verifier with `just oidc`:
#
#   oidc_issuer=https://accounts.google.com \
#   oidc_client_id=REPLACE.apps.googleusercontent.com \
#   oidc_authorization_endpoint=https://accounts.google.com/o/oauth2/v2/auth \
#   oidc_token_endpoint=https://oauth2.googleapis.com/token \
#   oidc_redirect_uri=http://localhost:18001/admin/v1/auth/google/callback \
#   oidc_verifier_socket=/run/hypellm/verify.sock
#
# The redirect URI must be listed on the OAuth client in the Google console,
# byte for byte. Google accepts an `http://localhost` redirect; it will not
# accept `http://127.0.0.1:18001` unless that exact spelling is registered too,
# which is the same trap `cors_origins` documents above.
#
# The verifier holds the OAuth client secret and the router never sees one —
# see spec/components/identity-verifier.html, which also has the procedure for enrolling the first
# administrator once sign-in works.

tenant id=local

# --- Local sign-in (username and password) --------------------------------
#
# Two accounts. `admin` administers; `approver` only reviews and publishes
# policy drafts, so a draft written as `admin` has a second principal to
# publish it without a break-glass session.
#
# **`admin` ships with the password `admin`.** A new deployment signs in as
# admin/admin with no other setup, and is therefore open to anyone who can
# reach the management listener until that password is changed. The router
# says so: `critical` `startup.default_password_in_use` on every start, and a
# red banner on every screen of the admin application for as long as the
# account's password is its own username. Change it first.
#
# `approver`'s password was generated on 2026-10-16 and lives only in this
# machine's run/secrets/approver.password (0600, never committed); the record
# carries a scrypt verifier, which cannot be reversed into it.
#
# The approver is separation of duty only if a different person holds it. One
# person with both passwords can publish their own changes; that is the honest
# description of this local profile, not a control.
#
# To change either password:
#
#     just password    # reads the password from stdin, prints the verifier
#
# then replace `verifier=` and `just restart`.
#
# The record carries a verifier, never a password. The configuration text is
# hashed into the digest and served through `GET /admin/v1/policies` to any
# caller who may read the active policy, so a password written here would be
# readable by every one of them.
#
# Local sign-in is a deviation from specification 9.2's four authentication
# methods, recorded in spec/deferred-issues.html. It is the weakest way in: an
# identity provider (spec/components/identity-verifier.html) is the supported one, and break-glass
# below remains the recovery path when the provider is unreachable.

local_user id=admin principal=user:admin tenant=local \
           verifier=scrypt$15$8$1$0eGdMvdJufxXPtQi9UQGhQ$tCMDWVdQMaheCVq98qE5Lp3xdoPlLuSKB4GegVCduEg \
           description="the initial local administrator; password admin until changed"

local_user id=approver principal=user:approver tenant=local \
           verifier=scrypt$15$8$1$0uopNKj-oyF1n58678LrdA$EZFhsqVL769xsPIymsmJdYLneL58iji4vAPJKoHzoGw \
           description="reviews and publishes policy drafts"

# Six roles. The four ordinary ones cover every screen the admin application
# has — targets and the fleet (operator), routing policy drafts and simulation
# (policy_editor), provider credentials (credential_manager), and the audit
# chain (auditor). `key_manager` mints, revokes and re-dates API keys, and
# `break_glass_admin` is here for the two permissions specification 9.1 gates
# behind recent authentication that no narrower role carries:
# `manage_principals` and `manage_settings`. Switching anonymous access from
# the Credentials screen needs one of those.
#
# `key_manager` is what lets a key outlive the sign-in that made it. Keys
# minted on break-glass authority alone expire with the session (an hour, see
# `break_glass_ttl_secs`); a key manager's last as long as it says, including
# forever. It is an addition to specification 9.3's roles — see
# spec/deferred-issues.html.
#
# **The break-glass binding makes this account fully privileged, deliberately.**
# Two consequences worth knowing rather than discovering:
#
#   * `break_glass_admin` carries **every** permission the model defines, not
#     only the two that were wanted. There is no narrower role holding
#     `manage_settings` — `Role::permissions` in `hypellm-core::rbac` is a
#     fixed table and there are no custom roles.
#   * The admin application marks every session this account opens as a
#     break-glass session: `Session::is_break_glass` is true for the *role*,
#     not only for the sign-in method. The banner, the critical log lines and
#     the audit entries that follow are all accurate and all constant, so they
#     stop distinguishing a real emergency from an ordinary sign-in.
#
# Both of those were the stated reason this was not the default. It is the
# default here now because this is the local development profile. With it,
# whoever holds this account's password is a full administrator. On a machine
# other people can reach: remove this binding, and mint keys as `key_manager`
# or through `just key` — which goes via break-glass and records why.
#
# `manage_keys` and `manage_settings` also require authentication within the
# last five minutes. Holding the role is not sufficient: a session left open
# past that window is refused with `reauthentication_required`, recoverable by
# signing out and back in.

role_binding subject=principal:user:admin role=operator
role_binding subject=principal:user:admin role=policy_editor
role_binding subject=principal:user:admin role=credential_manager
role_binding subject=principal:user:admin role=auditor
role_binding subject=principal:user:admin role=key_manager
role_binding subject=principal:user:admin role=break_glass_admin

# `policy_approver` publishes; `viewer` lets the account read the screens it
# reviews from. Neither can draft, so this account never approves its own work.
role_binding subject=principal:user:approver role=policy_approver
role_binding subject=principal:user:approver role=viewer

# --- Anonymous access (the subject; this file cannot switch it on) ---------
#
# **This file decides who, never whether.** `anonymous_enabled` is not a
# settings key: a configuration naming it does not load, in either direction,
# so there is no line anyone can add here to stop the inference listener
# requiring an API key. The switch is `POST /admin/v1/settings/anonymous` —
# the Credentials screen in the admin application — and it lives in the durable
# log, not in configuration.
#
# That split is the point. Anyone who can write this file can change routing;
# they cannot change whether authentication happens. And a restart cannot
# quietly reopen the router, because there is nothing here to reopen it with.
#
# What the `settings` record above declares is the subject —
# `anonymous_principal`, `anonymous_tenant`, `anonymous_scopes`. Those three
# are inert on their own and are what make the switch *available*: without
# both a principal and a tenant there is nobody to serve an uncredentialed
# request as, and the endpoint refuses to switch on. A half-declared subject,
# an undeclared tenant, an unknown scope, or either management scope is a
# startup error — refused where it was written rather than weeks later at the
# moment somebody presses the button.
#
# The principal also needs to be *selected* by a binding, exactly like any
# other subject. `binding id=local-default scope=tenant:local` above is
# tenant-wide, so `svc:public` in tenant `local` is already covered.
#
# Read the cost before switching it on. `inference_listen` is `0.0.0.0:18000`,
# which is on the tailnet: with it on, every tailnet peer can spend both
# Sparks' capacity, and there is no key to revoke and no caller to attribute a
# request to — every anonymous request is the same principal. On a listener
# reachable from the public internet it is an open inference endpoint.
#
# The router says so on every start while it is on (`critical`
# `startup.anonymous_access_enabled`), logs both edges of every change at
# critical, records an audit entry with a mandatory reason, and both the
# Credentials and Settings screens carry a banner. None of that is noise; it is
# the deviation announcing itself. See spec/deferred-issues.html.

# --- LLM slaves -----------------------------------------------------------
#
# The DGX Sparks, by their addresses on this machine's LAN (192.168.8.163 spark-ef2f,
# 192.168.8.187 spark-ff25), both on Ethernet since 2026-10-22; their Wi-Fi .105/.185 stay up as fallback. Both serve the same Qwen3.8 instance (checked 2026-10-19
# against each server's /v1/models and /props: model id qwen3.8-27b-hauhau-q8-k-p, build
# b10454, four slots on spark-ff25 and one on spark-ef2f). Each also runs a generative
# service, reached through a job shim beside it (see "Generative services" below): YuE2
# music in ComfyUI on spark-ff25, and the MiniMax-H3 audio-to-video app on spark-ef2f.
#
# `egress=private_network` is what permits cleartext to them: 192.168.8.0/24
# classifies as private, and this profile is the only one that allows plain
# HTTP to a non-loopback address. The cost is stated rather than hidden —
# prompts and completions to these targets are unencrypted on the network that
# carries them.
#
# Under Docker Desktop a container on this host could not reach these
# addresses: a compose network on 192.168.0.0/20 contained 192.168.8.0/24 and
# the Docker VM routed every packet for a slave onto a local bridge. Pods are
# on 10.42.0.0/16, which overlaps nothing on the LAN, so they reach the slaves
# through the node directly. `just lanroutes` checks each provider from inside
# the pod.
#
# A Tailscale subnet route is the other way, and sidesteps the collision
# entirely because the route lands in the container's own namespace:
#
#     # on a machine on 192.168.8.0/24, e.g. either Spark
#     sudo tailscale up --advertise-routes=192.168.8.0/24
#     # then approve the route in the Tailscale admin console
#
# `k8s/hypellm.yaml` already passes `--accept-routes`, and a subnet route preserves
# the destination address — the router still dials 192.168.8.163, so the
# profile below stays an accurate description of what it is talking to.
# `just tailnet` lists the routes actually learned.
#
# Do *not* substitute their 100.x tailnet addresses. 100.64.0.0/10 classifies
# as `shared_address_space`, which `EgressProfile::permits` refuses under every
# profile (crates/hypellm-core/src/netaddr.rs) — carrier-grade NAT space is a
# known SSRF pivot and the router denies it outright.

# What is registered below is what runs on 2026-10-16: the Qwen3.8 instance
# ml-models/qwen38-27b-hauhau-q8kp (services repo) on both Sparks — llama.cpp on host port
# 8000 and its SemIf bridge on host port 8898. Every Qwen alias names both chat targets;
# `decide` names spark-ff25's alone (see the SemIf section). The spark-ff25 ids predate the
# second machine and are kept so existing traces and policies still match.

# Machine memory (spec/router-specification.html, "Machine memory"). Each Spark's unified
# memory is shared by everything on it, and an H3 or YuE2 job that starts beside another
# fails in the driver (NV_ERR_NO_MEMORY) rather than here. A `machine` is that pool, less
# what is resident whatever runs: the OS and Docker (~8 GiB) and the Qwen container. A
# target's `run_memory_bytes` is what one of its requests or jobs holds while it runs, and
# work starts only when it fits; `class` orders the wait — interactive (Qwen), then
# standard (YuE2), then batch (MiniMax-H3) — and a waiting higher class holds back a lower
# one even when the lower one would fit. Qwen holds nothing extra (its KV is allocated at
# start), so chat is never held back. Only work routed through this router is counted:
# a client that calls a service's own port directly is invisible to it.
#
# spark-ef2f (.105): 121.7 GiB, less 1-slot Qwen (~42 GiB) and the OS: 72 GiB.
# MiniMax-H3 (64) and YuE2 (24) do not fit together, so they take turns.
machine id=spark-ef2f memory_bytes=77309411328 \
        description="DGX Spark .105: 121.7 GiB unified, less ~42 GiB resident Qwen and ~8 GiB OS"
# spark-ff25 (.185): 121.7 GiB, less 4-slot Qwen (~78 GiB) and the OS: 36 GiB, room for one YuE2.
machine id=spark-ff25 memory_bytes=38654705664 \
        description="DGX Spark .185: 121.7 GiB unified, less ~78 GiB resident Qwen and ~8 GiB OS"

provider id=spark-q8kp family=llamacpp scheme=http host=192.168.8.187 port=8000 \
         base_path=/v1 egress=private_network machine=spark-ff25

# `local=true` is load-bearing, not descriptive: a target with no credential
# reference that is not marked local is excluded from every request as
# `credential_scope_mismatch`. A local slave needs no credential.
#
# spark-ff25's server runs four slots: `concurrency=3` for chat and one for decisions, so a
# decision never waits behind running generations. spark-ef2f's runs one slot, so its target
# has `concurrency=1`; with both listed, the queue penalty (in-flight over `concurrency`)
# sends work to whichever has room — see the binding below. The slots share one 1,048,576-token KV pool
# (`--kv-unified`, 80 GiB loaded; twice that does not fit the Spark), which is exactly four times
# the model's native 262,144 tokens, so every request can reach the full `context` at once.

# HauhauCS Aggressive Q8_K_P, FastMTP, vision, `--reasoning off`.
target id=spark-q8kp:qwen38 provider=spark-q8kp model=qwen3.8-27b-hauhau-q8-k-p local=true \
       aliases=qwen3.8-27b-hauhau-q8-k-p,qwen3.8-27b,qwen38-27b-hauhau-q8kp,chat-standard,vision-standard,qwen-any,agent \
       capabilities=chat,vision modalities=text,image \
       reasoning_efforts=low \
       operations=chat,responses streaming=true tools=true json_mode=true structured_output=true \
       context=262144 max_output=32768 quality_class=7 cost=1 \
       concurrency=3 rps=20 class=interactive

# The same model, build (b10454) and server flags on spark-ef2f, one 262,144-token slot.
provider id=spark-ef2f-q8kp family=llamacpp scheme=http host=192.168.8.163 port=8000 \
         base_path=/v1 egress=private_network machine=spark-ef2f

target id=spark-ef2f-q8kp:qwen38 provider=spark-ef2f-q8kp model=qwen3.8-27b-hauhau-q8-k-p local=true \
       aliases=qwen3.8-27b-hauhau-q8-k-p,qwen3.8-27b,qwen38-27b-hauhau-q8kp,chat-standard,vision-standard,qwen-any,agent \
       capabilities=chat,vision modalities=text,image \
       reasoning_efforts=low \
       operations=chat,responses streaming=true tools=true json_mode=true structured_output=true \
       context=262144 max_output=32768 quality_class=7 cost=1 \
       concurrency=1 rps=20 class=interactive

# The id both llama.cpp servers report from /v1/models, so a client configured against a
# Spark directly keeps working when pointed at the router.
alias id=qwen3.8-27b-hauhau-q8-k-p capability=chat targets=spark-q8kp:qwen38,spark-ef2f-q8kp:qwen38 \
      description="the model id llama.cpp reports"
alias id=qwen3.8-27b capability=chat targets=spark-q8kp:qwen38,spark-ef2f-q8kp:qwen38 \
      description="Qwen3.8 27B HauhauCS Q8_K_P on both Sparks"
# SkyGraph's dashboard generation and assistant (SG_LLM_MODEL) call this one. They copy dataset
# ids, field names and timestamps into constrained JSON, which DRY mangles exactly as it does the
# agent's identifiers (see `agent` below): a revision wrote "2026-08-24T00:00:00" as
# "2026-0824T00:00:00" (2026-10-21). So DRY is off here too.
alias id=qwen38-27b-hauhau-q8kp capability=chat targets=spark-q8kp:qwen38,spark-ef2f-q8kp:qwen38 dry_multiplier=0 \
      description="the instance by name (services repo ml-models/qwen38-27b-hauhau-q8kp): DRY off"
alias id=chat-standard capability=chat targets=spark-q8kp:qwen38,spark-ef2f-q8kp:qwen38 \
      description="the default chat model"
alias id=vision-standard capability=vision targets=spark-q8kp:qwen38,spark-ef2f-q8kp:qwen38 \
      description="images"
alias id=qwen-any capability=chat targets=spark-q8kp:qwen38,spark-ef2f-q8kp:qwen38 \
      description="text or images"
# For tool-using agents (the SkyGraph harness): the server's DRY penalty (--dry-multiplier 0.8,
# --dry-allowed-length 2) garbles identifiers copied from tool results, so this alias turns it off.
# Measured on both Sparks (b10454, 2026-10-20), a model copying 40 UUIDs out of a tool result
# into tool-call JSON, three runs each:
#   server defaults (DRY 0.8, --repeat-penalty 1.15 over --repeat-last-n 163840): 0 of 40 correct
#   DRY 0 (this alias), repeat penalty left at 1.15: 40 of 40
#   DRY 0, repeat penalty 1: 40 of 40
# Even a gentler DRY (allowed length 12, newline the only breaker) had the SkyGraph harness change a
# dashboard id on every retry. So DRY stays off and the repeat penalty is left as the server sets it.
alias id=agent capability=chat targets=spark-q8kp:qwen38,spark-ef2f-q8kp:qwen38 dry_multiplier=0 \
      description="tool-using agents: DRY off so identifiers survive"

# --- SemIf decisions ------------------------------------------------------
#
# Not an OpenAI-compatible endpoint and not a chat model: the bridge serves `POST /score` at the
# root, so `base_path` is absent (crates/hypellm-adapters/src/semif.rs). It reads the answer
# letters' probabilities from the same llama.cpp instance as the chat target. `context` is the
# bridge's --max-tokens.
#
# spark-ef2f runs the same bridge on :8898, registered as a fallback only: its llama.cpp has
# one slot, which the chat target above also uses, so a sub-second decision there can queue
# behind a generation that runs for minutes. The `local-decide` binding below ranks it after
# spark-ff25, which keeps a slot for decisions; see that binding for when it is used.
provider id=spark-q8kp-semif family=semif scheme=http host=192.168.8.187 port=8898 \
         egress=private_network machine=spark-ff25

target id=spark-q8kp-semif:qwen38 provider=spark-q8kp-semif \
       model=Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-Q8_K_P local=true aliases=decide \
       capabilities=rerank operations=rerank modalities=text \
       streaming=false tools=false json_mode=false \
       context=16384 max_output=1 quality_class=7 cost=1 \
       concurrency=1 rps=20 class=interactive

provider id=spark-ef2f-q8kp-semif family=semif scheme=http host=192.168.8.163 port=8898 \
         egress=private_network machine=spark-ef2f

# No quota, so no queue: when its one decision is in flight a second is refused here and
# goes nowhere else, rather than waiting on a machine that may be mid-generation.
target id=spark-ef2f-q8kp-semif:qwen38 provider=spark-ef2f-q8kp-semif \
       model=Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-Q8_K_P local=true aliases=decide \
       capabilities=rerank operations=rerank modalities=text \
       streaming=false tools=false json_mode=false \
       context=16384 max_output=1 quality_class=7 cost=1 \
       concurrency=1 rps=20 class=interactive

alias id=decide capability=rerank targets=spark-q8kp-semif:qwen38,spark-ef2f-q8kp-semif:qwen38 \
      description="SemIf option scoring; POST /v1/rerank, 2-16 documents"

# Without a queue a second concurrent decision is refused outright as `capacity_exhausted`; a
# decision is sub-second, so a short wait is what a caller wants.
quota scope=target:spark-q8kp-semif:qwen38 concurrency=1 queued=8 class=interactive

# --- Generative services (artifact jobs) ----------------------------------
#
# Each service is behind a job shim on its own host (job-shim/, orchestration 11.3):
# the shim speaks the router's job protocol and runs a backend from
# job-shim/backends/ against the service. ~/system/fleet/hypellm-shims/deploy.sh
# deploys them; `deploy.sh key <shim>` writes the bearer to both the shim and
# run/secrets/credentials/<credential>, which is what each `credential` names.
# A client reaches them only as POST /v1/jobs with a `verb` (spec/using-the-router.html);
# the result's parts are served by the router, never by the service.
#
# Every shim runs one job at a time, so every target has `concurrency=1` and the
# router's job queue does the waiting. The services themselves are still on the LAN
# unauthenticated; the shim's bearer protects only the shim.

credential id=cred_shim_flux description="bearer for the FLUX.2 shim on .186:17870"
credential id=cred_shim_trellis description="bearer for the TRELLIS shim on .186:17871"
credential id=cred_shim_kimodo description="bearer for the Kimodo shim on .186:19551"
credential id=cred_shim_h3 description="bearer for the MiniMax-H3 shim on spark-ef2f:17860"
credential id=cred_shim_yue_185 description="bearer for the YuE2 shim on spark-ff25:18188"
credential id=cred_shim_yue_105 description="bearer for the YuE2 shim on spark-ef2f:18188"
credential id=cred_shim_yue_182 description="bearer for the YuE2 shim on .182:18188"

# FLUX.2 [klein] 9B on .186's RTX 4090 Laptop: ~83 s for 1024x1024, ~155 s with a
# reference image to edit.
provider id=shim-flux family=job scheme=http host=192.168.8.186 port=17870 \
         egress=private_network credential=cred_shim_flux
target id=shim-flux:flux2-klein provider=shim-flux model=flux2-klein \
       operations=job capabilities=text-to-image concurrency=1
alias id=flux2-klein capability=text-to-image targets=shim-flux:flux2-klein \
      description="FLUX.2 [klein] 9B: text-to-image, or an edit of a reference image"

# TRELLIS image-large, beside FLUX on the same 16 GB card: one object per image, ~55 s.
provider id=shim-trellis family=job scheme=http host=192.168.8.186 port=17871 \
         egress=private_network credential=cred_shim_trellis
target id=shim-trellis:trellis provider=shim-trellis model=trellis \
       operations=job capabilities=image-to-3d concurrency=1
alias id=trellis capability=image-to-3d targets=shim-trellis:trellis \
      description="TRELLIS: one image of one object to a textured GLB"

# Kimodo SOMA-RP; the motion model runs on .186's CPU in the shim's container (the
# GPU is FLUX's and TRELLIS's), ~40 s for a 3 s clip.
provider id=shim-kimodo family=job scheme=http host=192.168.8.186 port=19551 \
         egress=private_network credential=cred_shim_kimodo
target id=shim-kimodo:kimodo provider=shim-kimodo model=kimodo-soma-rp \
       operations=job capabilities=text-to-motion concurrency=1
alias id=kimodo capability=text-to-motion targets=shim-kimodo:kimodo \
      description="Kimodo: a text prompt to a skeletal animation (NPZ and BVH)"

# MiniMax-H3 on spark-ef2f, conditioned by the encoder on .186:8896. Since 2026-10-21 it
# holds no GPU memory between jobs (the weights are mapped from disk and moved to the GPU
# per job), and a 6 s 1080p shot peaks at ~57 GiB of CUDA allocation; 64 GiB covers that.
provider id=shim-h3 family=job scheme=http host=192.168.8.163 port=17860 \
         egress=private_network credential=cred_shim_h3 machine=spark-ef2f
target id=shim-h3:minimax-h3 provider=shim-h3 model=minimax-h3 \
       operations=job capabilities=audio-to-video concurrency=1 \
       run_memory_bytes=68719476736 class=batch
alias id=minimax-h3 capability=audio-to-video targets=shim-h3:minimax-h3 \
      description="MiniMax-H3: a soundtrack, a prompt and an optional keyframe to a 2-6 s 1080p shot"

# YuE2 BF16 in ComfyUI on both Sparks and on .182's 1080 Ti. The spark-ff25 and .182
# ComfyUIs are also the Iron Curtain runner's workers, so a job waits in their queues behind
# its prompts. A YuE2 job holds ~24 GiB of a Spark; .182's card is its own, so no machine.
# spark-ef2f's ComfyUI (since 2026-10-21) runs with --disable-smart-memory and
# --disable-pinned-memory, so it gives its memory back between prompts.
provider id=shim-yue-185 family=job scheme=http host=192.168.8.187 port=18188 \
         egress=private_network credential=cred_shim_yue_185 machine=spark-ff25
target id=shim-yue-185:yue2 provider=shim-yue-185 model=yue2 \
       operations=job capabilities=text-to-music concurrency=1 \
       run_memory_bytes=25769803776 class=standard
provider id=shim-yue-105 family=job scheme=http host=192.168.8.163 port=18188 \
         egress=private_network credential=cred_shim_yue_105 machine=spark-ef2f
target id=shim-yue-105:yue2 provider=shim-yue-105 model=yue2 \
       operations=job capabilities=text-to-music concurrency=1 \
       run_memory_bytes=25769803776 class=standard
provider id=shim-yue-182 family=job scheme=http host=192.168.8.223 port=18188 \
         egress=private_network credential=cred_shim_yue_182
target id=shim-yue-182:yue2 provider=shim-yue-182 model=yue2 \
       operations=job capabilities=text-to-music concurrency=1
alias id=yue2 capability=text-to-music targets=shim-yue-185:yue2,shim-yue-105:yue2,shim-yue-182:yue2 \
      description="YuE2: a style prompt and optional lyrics to a song, FLAC"

# --- Remote providers (over the TLS helper) ------------------------------
#
# `tls_helper_socket` above points at the `tls-helper` sidecar
# (spec/components/tls-helper.html), which terminates outbound TLS with the
# platform's OpenSSL and serves only the hosts in tls-helper/tls-helper.json
# (DeepSeek, OpenAI, Anthropic, Moonshot on 443). No remote provider is
# declared yet: a `credential` record whose file is missing is a startup
# failure, and no API key has been provided. To add DeepSeek, put its key in
# run/secrets/credentials/deepseek (0600) and uncomment:
#
#   credential id=deepseek description="DeepSeek API key"
#   provider id=deepseek family=deepseek scheme=https host=api.deepseek.com port=443 \
#            base_path=/v1 credential=deepseek egress=remote
#   target id=deepseek:chat provider=deepseek model=deepseek-chat aliases=deepseek-chat \
#          capabilities=chat operations=chat modalities=text streaming=true tools=true \
#          json_mode=true context=65536 max_output=8192 quality_class=7 cost=5 concurrency=8
#   alias id=deepseek-chat capability=chat targets=deepseek:chat \
#         description="DeepSeek's hosted chat model, over the TLS helper"
#
# `context` and `max_output` there are placeholders that validate, not
# DeepSeek's published limits; check them, and add a `price` record, before
# relying on either.

# --- Price schedule -------------------------------------------------------
#
# The Sparks send no invoice, so these are an estimate rather than a cost: the
# hosted rate for a 27B open-weights model of this class, $0.30 per million
# input tokens and $1.20 per million output (minor units — cents — per million;
# spec/deployment.html "Price schedules"). They exist so that a quota `budget`
# (in the same cents) refuses at all, and so the usage view shows a figure;
# without any `price` record every request costs zero. Change the rates to an
# internal chargeback figure if one exists. `effective_from` is 2026-10-16 UTC;
# usage before it is reported without a figure.
price target=spark-q8kp:qwen38 input_per_million=30 output_per_million=120 \
      currency=USD effective_from=1792108800000
price target=spark-ef2f-q8kp:qwen38 input_per_million=30 output_per_million=120 \
      currency=USD effective_from=1792108800000
price target=spark-q8kp-semif:qwen38 input_per_million=30 output_per_million=120 \
      currency=USD effective_from=1792108800000
price target=spark-ef2f-q8kp-semif:qwen38 input_per_million=30 output_per_million=120 \
      currency=USD effective_from=1792108800000

grant scope=tenant:local model=* allow=true
# `prefer` is a ranked list, and it is also the selector: a target no binding names is
# excluded as `not_selected_by_any_binding` however many aliases list it. Naming only the
# first Spark left the second idle through 165 consecutive exclusions, so the fleet's
# capacity was one machine's three slots and a saturated node had no failover.
#
# Naming them *in order* was the next mistake, and a quieter one. Position in `prefer`
# becomes the rank, and `ScoreTerms::RANK_UNIT` is 1,000,000 precisely so that a better
# rank beats every other term combined — the queue penalty saturates at -50,000. A rank-0
# Spark therefore outscores a rank-1 Spark by a margin no amount of load can close, and
# the second machine received work only when the first was *filtered out* by
# `has_capacity`. Over 40 hours that was 4,506 requests to `spark` and 43 to `spark2`.
#
# `*` is `TargetSelector::Any`, so both Sparks take rank 0 from one entry and the tie
# falls to the non-rank terms. They are identical in locality, cost and capability, so
# what actually decides is the queue penalty — in-flight over `concurrency`, scaled — and
# the latency penalty. That is least-loaded routing, and it is the scoring model working
# as designed rather than a new mechanism bolted onto it.
#
# `*` selecting a future target is not the widening it looks like: the alias is the
# eligibility filter, and a target no alias names is never a candidate to rank.
binding id=local-default scope=tenant:local model=* prefer=*

# `decide` is the one place the ordered `prefer` above is wanted. An exact model outranks
# `model=*` at the same scope, so this binding alone ranks the two SemIf bridges: spark-ff25
# first, and spark-ef2f only when spark-ff25 is filtered out — unhealthy, circuit open, or
# holding 1 + 8 queued decisions (`has_capacity` counts the queue allowance) — or when an
# attempt on it fails and the router retries elsewhere.
binding id=local-decide scope=tenant:local model=decide \
        prefer=spark-q8kp-semif:qwen38,spark-ef2f-q8kp-semif:qwen38

# The break-glass principal signs in on the admin application's sign-in screen
# ("Use break-glass access", revealed automatically because Google sign-in
# answers not_found here), or through POST /admin/v1/auth/break-glass directly.
# It is not the only way in — the `local_user` account above signs in with a
# password and holds `key_manager` — but `just key` goes through it, so keys
# minted that way expire with the break-glass session.
role_binding subject=principal:operator role=break_glass_admin
