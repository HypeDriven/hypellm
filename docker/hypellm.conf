# HypeLLM Router — local container profile.
#
# The router runs inside the Tailscale sidecar's network namespace
# (`compose.yaml`), so this file decides which of the three listeners the
# tailnet can reach. The namespace has three interfaces:
#
#   lo          127.0.0.1
#   eth0        10.89.7.2      the compose bridge, pinned in compose.yaml
#   tailscale0  100.64.x.x     assigned by the tailnet
#
# A listener bound to 0.0.0.0 accepts on all three, including the tailnet. A
# listener bound to 10.89.7.2 accepts on the bridge only, which is what the
# published host ports reach and what a tailnet peer cannot. That is the whole
# mechanism, and it fails closed: it does not depend on a Tailscale ACL, on
# `--shields-up`, or on a firewall rule written somewhere else.
#
# This is a development document. It terminates no TLS of its own, declares no
# OIDC, and grants one tenant everything — see docs/deployment.md for what a
# single secure node requires instead.
#
# `cors_origins` lists both spellings of the host deliberately. A browser sends
# `Origin` on a same-origin POST too, the allowlist is compared exactly — no
# host equivalence, no scheme coercion — and `localhost` is not `127.0.0.1`.
# With only one of them listed, opening the admin application by the other name
# loads the page and then fails every mutating call with `origin_not_permitted`.

settings inference_listen=0.0.0.0:18000 \
         admin_listen=10.89.7.2:18001 \
         metrics_listen=10.89.7.2:18002 \
         state_dir=/var/lib/hypellm \
         cors_origins=http://localhost:18001,http://127.0.0.1:18001 \
         break_glass_principal=operator \
         break_glass_tenant=local \
         break_glass_ttl_secs=3600

tenant id=local

# --- LLM slaves -----------------------------------------------------------
#
# The two DGX Sparks, by their addresses on this machine's LAN. Confirmed to be
# the same machines described in docs/examples/fleet.conf (same last octets,
# same models):
#
#     192.168.8.105  qwen3.8-27b-obliterated-q5-k-m   3 slots   vision
#     192.168.8.185  qwen3.8-27b-obliterated-q6-k     3 slots   vision
#
# Note the quantisations differ. Both sit behind one alias, so an identical
# request can be served at Q5 or Q6 depending on which Spark ranks first. If
# that difference matters to a caller, it needs two aliases and two quality
# classes rather than one.
#
# `egress=private_network` is what permits cleartext to them: 192.168.8.0/24
# classifies as private, and this profile is the only one that allows plain
# HTTP to a non-loopback address. The cost is stated rather than hidden —
# prompts and completions to these targets are unencrypted on the network that
# carries them.
#
# **A container on this host could not reach these addresses, and the cause was
# local.** Docker allocates bridge subnets from a built-in pool ending in
# 192.168.0.0/16, reached once 172.17-172.31 are used up; on this machine that
# put a compose network on 192.168.0.0/20, which *contains* 192.168.8.0/24. The
# Docker VM therefore routed every packet for a slave onto a local bridge:
#
#     ip route get 192.168.8.105
#     192.168.8.105 dev br-814c33bb4ef9  src 192.168.0.1
#
# The host itself was unaffected, which is what makes it easy to miss — `curl`
# in a terminal works and the identical `curl` in a container times out.
# `just up` runs `just lanroutes`, which detects this and installs a /32 for
# each provider via the VM's real gateway. Docker Desktop's egress reaches the
# LAN perfectly well once the collision is out of the way.
#
# A Tailscale subnet route is the other way, and sidesteps the collision
# entirely because the route lands in the container's own namespace:
#
#     # on a machine on 192.168.8.0/24, e.g. either Spark
#     sudo tailscale up --advertise-routes=192.168.8.0/24
#     # then approve the route in the Tailscale admin console
#
# `compose.yaml` already passes `--accept-routes`, and a subnet route preserves
# the destination address — the router still dials 192.168.8.105, so the
# profile below stays an accurate description of what it is talking to.
# `just tailnet` lists the routes actually learned.
#
# Do *not* substitute their 100.x tailnet addresses. 100.64.0.0/10 classifies
# as `shared_address_space`, which `EgressProfile::permits` refuses under every
# profile (crates/hypellm-core/src/netaddr.rs) — carrier-grade NAT space is a
# known SSRF pivot and the router denies it outright.

provider id=spark family=llamacpp scheme=http host=192.168.8.105 port=8000 \
         base_path=/v1 egress=private_network
provider id=spark2 family=llamacpp scheme=http host=192.168.8.185 port=8000 \
         base_path=/v1 egress=private_network

# `local=true` is load-bearing, not descriptive: a target with no credential
# reference that is not marked local is excluded from every request as
# `credential_scope_mismatch`. A llama.cpp slave needs no credential.
#
# `concurrency=3` is llama.cpp's `--parallel`, measured as `total_slots` from
# `GET /props` on each machine — not a policy preference. Higher and the excess
# queues inside llama.cpp where the router cannot see it, ignoring the deadline
# and backpressure the router would otherwise apply; lower and a slot idles.
#
# `capabilities=chat,vision` with `modalities=text,image`: both Sparks report
# `"vision": true` and both correctly identified a solid-red PNG sent as an
# `image_url` part. `document` is deliberately not declared — a document is
# forwarded opaquely and llama.cpp has no path for one.
#
# `context=131072` matches docs/examples/fleet.conf. Each of the three slots
# actually reports `n_ctx: 262144`, so this is conservative: it refuses
# requests the slave could serve, and never the reverse.

target id=spark:qwen38-q5 provider=spark model=qwen38-27b-mtp local=true \
       aliases=qwen3.8-27b,chat-standard,vision-standard,qwen-any \
       capabilities=chat,vision modalities=text,image \
       reasoning_efforts=minimal,low,medium,high \
       operations=chat,responses streaming=true tools=true json_mode=true \
       context=131072 max_output=32768 quality_class=7 cost=1 \
       concurrency=3 rps=20

target id=spark2:qwen38-q5 provider=spark2 model=qwen38-27b-mtp local=true \
       aliases=qwen3.8-27b,chat-standard,vision-standard,qwen-any \
       capabilities=chat,vision modalities=text,image \
       reasoning_efforts=minimal,low,medium,high \
       operations=chat,responses streaming=true tools=true json_mode=true \
       context=131072 max_output=32768 quality_class=7 cost=1 \
       concurrency=3 rps=20

alias id=qwen3.8-27b capability=chat targets=spark:qwen38-q5,spark2:qwen38-q5 \
      description="Qwen3.8 27B, whichever Spark is warm"
alias id=chat-standard capability=chat targets=spark:qwen38-q5,spark2:qwen38-q5 \
      description="the default chat model"
alias id=vision-standard capability=vision targets=spark:qwen38-q5,spark2:qwen38-q5 \
      description="images"
alias id=qwen-any capability=chat targets=spark:qwen38-q5,spark2:qwen38-q5 \
      description="text or images, routed by modality"

grant scope=tenant:local model=* allow=true
binding id=local-default scope=tenant:local model=* prefer=spark:qwen38-q5

# The break-glass principal signs in through POST /admin/v1/auth/break-glass.
# With no OIDC configured it is the only way into the management plane — and
# see docs/deferred-issues.md, because the binary does not print the token.
role_binding subject=principal:operator role=break_glass_admin
