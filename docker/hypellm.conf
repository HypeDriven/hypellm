# HypeLLM Router — local container profile.
#
# The router runs inside the Tailscale sidecar's network namespace
# (`compose.yaml`), so this file decides which of the three listeners the
# tailnet can reach. The namespace has three interfaces:
#
#   lo          127.0.0.1
#   eth0        10.89.7.2      the compose bridge, pinned in compose.yaml
#   tailscale0  100.64.x.x     assigned by the tailnet
#
# A listener bound to 0.0.0.0 accepts on all three, including the tailnet. A
# listener bound to 10.89.7.2 accepts on the bridge only, which is what the
# published host ports reach and what a tailnet peer cannot. That is the whole
# mechanism, and it fails closed: it does not depend on a Tailscale ACL, on
# `--shields-up`, or on a firewall rule written somewhere else.
#
# This is a development document. It terminates no TLS of its own, declares no
# OIDC, and grants one tenant everything — see docs/deployment.md for what a
# single secure node requires instead.
#
# `cors_origins` lists both spellings of the host deliberately. A browser sends
# `Origin` on a same-origin POST too, the allowlist is compared exactly — no
# host equivalence, no scheme coercion — and `localhost` is not `127.0.0.1`.
# With only one of them listed, opening the admin application by the other name
# loads the page and then fails every mutating call with `origin_not_permitted`.

# `default_deadline_ms` and `retry_budget_ms` are both raised because the effective
# budget is the LOWER of the two (`overall = deadline.min(retry_budget)`), so the
# shipped 30s retry budget capped every request at 30s regardless of the 120s
# deadline. Composing a whole dashboard is a single completion of two to four
# minutes and returned 504 at exactly 30s; clients carry their own, shorter budget.
#
# 300s was still short of the client that asks for the most. Measured over 39 real
# dashboard-design completions on the Q4 fleet, 3 died here as `deadline_exceeded`
# at ~305s while dashboard-service was configured to wait 600s — so its budget was
# fiction and the longest designs could never finish. Successful designs reached
# 185s and 234s, which is close enough to 300s that the ceiling was being hit on
# ordinary work rather than on a pathological prompt. Both values now match the
# 600s that service asks for; raising only one would restore the same bug, because
# the effective budget is still the lower of the two.

# `weighted_tie_break` matters once the two Sparks share a rank (see the binding
# below). `Candidate::ordering_key` falls back to the target id on an exact score
# tie, and `spark:qwen38-q5` sorts before `spark2:qwen38-q5`, so with both machines
# idle every request would still land on the first one. The jitter is derived from
# the request id, so it spreads the idle case without costing determinism: the same
# request against the same snapshot and live state still ranks identically.

settings inference_listen=0.0.0.0:18000 \
         admin_listen=10.89.7.2:18001 \
         metrics_listen=10.89.7.2:18002 \
         state_dir=/var/lib/hypellm \
         default_deadline_ms=600000 \
         retry_budget_ms=600000 \
         queue_timeout_ms=300000 \
         weighted_tie_break=true \
         cors_origins=http://localhost:18001,http://127.0.0.1:18001 \
         break_glass_principal=operator \
         break_glass_tenant=local \
         break_glass_ttl_secs=3600 \
         anonymous_principal=svc:public \
         anonymous_tenant=local \
         anonymous_scopes=inference,models

# --- Google sign-in (optional, off) ---------------------------------------
#
# Nothing above configures OIDC, so `POST /admin/v1/auth/google/start` answers
# `not_found` and the sign-in screen falls back to break-glass. That is the
# supported local profile, not a misconfiguration.
#
# To turn it on, add these to the `settings` record above and start the
# verifier with `docker compose --profile oidc up -d verifier`:
#
#   oidc_issuer=https://accounts.google.com \
#   oidc_client_id=REPLACE.apps.googleusercontent.com \
#   oidc_authorization_endpoint=https://accounts.google.com/o/oauth2/v2/auth \
#   oidc_token_endpoint=https://oauth2.googleapis.com/token \
#   oidc_redirect_uri=http://localhost:18001/admin/v1/auth/google/callback \
#   oidc_verifier_socket=/run/hypellm/verify.sock
#
# The redirect URI must be listed on the OAuth client in the Google console,
# byte for byte. Google accepts an `http://localhost` redirect; it will not
# accept `http://127.0.0.1:18001` unless that exact spelling is registered too,
# which is the same trap `cors_origins` documents above.
#
# The verifier holds the OAuth client secret and the router never sees one —
# see verifier/README.md, which also has the procedure for enrolling the first
# administrator once sign-in works.

tenant id=local

# --- Local sign-in (username and password) --------------------------------
#
# `admin` / `admin`, so a fresh checkout has a way into the management plane
# before an identity provider exists. **This is a shipped default credential**:
# it is why the section below says what it says, and it is the first thing to
# change on any machine other people can reach.
#
#     printf '%s' 'the-new-password' | \
#         docker compose exec -T router hypellm-router --hash-password
#
# then replace `verifier=` and `just restart`. The router derives one
# verification of its own at every start and logs `critical`
# `startup.default_password_in_use` for any account whose password is its own
# username — which is exactly this one, until it is changed.
#
# The record carries a verifier, never a password. The configuration text is
# hashed into the digest and served through `GET /admin/v1/policies` to any
# caller who may read the active policy, so a password written here would be
# readable by every one of them.
#
# Local sign-in is a deviation from specification 9.2's four authentication
# methods, recorded in docs/deferred-issues.md. It is the weakest way in: an
# identity provider (verifier/README.md) is the supported one, and break-glass
# below remains the recovery path when the provider is unreachable.

local_user id=admin principal=user:admin tenant=local \
           verifier=scrypt$15$8$1$Ps66XgGw7miPbCcebtUQXQ$B95aPadoi-jTcdw8dF7ZUKZ_7o59hIicPgn1jIcdpKM \
           description="the initial local administrator"

# Five roles. The four ordinary ones cover every screen the admin application
# has — targets and the fleet (operator), routing policy drafts and simulation
# (policy_editor), provider credentials (credential_manager), and the audit
# chain (auditor) — and `break_glass_admin` is here for the three permissions
# specification 9.1 gates behind recent authentication: `manage_keys`,
# `manage_principals` and `manage_settings`. Minting an API key from the Keys
# screen and switching anonymous access from the Credentials screen both need
# one of those, and neither is reachable without this binding.
#
# **The fifth binding makes this account fully privileged, deliberately.** Two
# consequences worth knowing rather than discovering:
#
#   * `break_glass_admin` carries **every** permission the model defines, not
#     only the three that were wanted. There is no narrower role holding
#     `manage_keys` or `manage_settings` — `Role::permissions` in
#     `hypellm-core::rbac` is a fixed table and there are no custom roles.
#   * The admin application marks every session this account opens as a
#     break-glass session: `Session::is_break_glass` is true for the *role*,
#     not only for the sign-in method. The banner, the critical log lines and
#     the audit entries that follow are all accurate and all constant, so they
#     stop distinguishing a real emergency from an ordinary sign-in.
#
# Both of those were the stated reason this was not the default. It is the
# default here now because this is the local development profile and this
# account signs in with `admin`/`admin`. Those two facts together mean anyone
# who reaches the management listener is a full administrator. On a machine
# other people can reach: remove this binding first, change that password
# second, and mint keys through `just key` — which goes via break-glass and
# records why it happened.
#
# `manage_keys` and `manage_settings` also require authentication within the
# last five minutes. Holding the role is not sufficient: a session left open
# past that window is refused with `reauthentication_required`, recoverable by
# signing out and back in.

role_binding subject=principal:user:admin role=operator
role_binding subject=principal:user:admin role=policy_editor
role_binding subject=principal:user:admin role=credential_manager
role_binding subject=principal:user:admin role=auditor
role_binding subject=principal:user:admin role=break_glass_admin

# --- Anonymous access (the subject; this file cannot switch it on) ---------
#
# **This file decides who, never whether.** `anonymous_enabled` is not a
# settings key: a configuration naming it does not load, in either direction,
# so there is no line anyone can add here to stop the inference listener
# requiring an API key. The switch is `POST /admin/v1/settings/anonymous` —
# the Credentials screen in the admin application — and it lives in the durable
# log, not in configuration.
#
# That split is the point. Anyone who can write this file can change routing;
# they cannot change whether authentication happens. And a restart cannot
# quietly reopen the router, because there is nothing here to reopen it with.
#
# What the `settings` record above declares is the subject —
# `anonymous_principal`, `anonymous_tenant`, `anonymous_scopes`. Those three
# are inert on their own and are what make the switch *available*: without
# both a principal and a tenant there is nobody to serve an uncredentialed
# request as, and the endpoint refuses to switch on. A half-declared subject,
# an undeclared tenant, an unknown scope, or either management scope is a
# startup error — refused where it was written rather than weeks later at the
# moment somebody presses the button.
#
# The principal also needs to be *selected* by a binding, exactly like any
# other subject. `binding id=local-default scope=tenant:local` above is
# tenant-wide, so `svc:public` in tenant `local` is already covered.
#
# Read the cost before switching it on. `inference_listen` is `0.0.0.0:18000`,
# which is on the tailnet: with it on, every tailnet peer can spend both
# Sparks' capacity, and there is no key to revoke and no caller to attribute a
# request to — every anonymous request is the same principal. On a listener
# reachable from the public internet it is an open inference endpoint.
#
# The router says so on every start while it is on (`critical`
# `startup.anonymous_access_enabled`), logs both edges of every change at
# critical, records an audit entry with a mandatory reason, and both the
# Credentials and Settings screens carry a banner. None of that is noise; it is
# the deviation announcing itself. See docs/deferred-issues.md.

# --- LLM slaves -----------------------------------------------------------
#
# The two DGX Sparks, by their addresses on this machine's LAN. Confirmed to be
# the same machines described in docs/examples/fleet.conf (same last octets,
# same models):
#
#     192.168.8.105  qwen3.8-27b-obliterated-q5-k-m   3 slots   vision
#     192.168.8.185  qwen3.8-27b-obliterated-q6-k     3 slots   vision
#
# Note the quantisations differ. Both sit behind one alias, so an identical
# request can be served at Q5 or Q6 depending on which Spark ranks first. If
# that difference matters to a caller, it needs two aliases and two quality
# classes rather than one.
#
# `egress=private_network` is what permits cleartext to them: 192.168.8.0/24
# classifies as private, and this profile is the only one that allows plain
# HTTP to a non-loopback address. The cost is stated rather than hidden —
# prompts and completions to these targets are unencrypted on the network that
# carries them.
#
# **A container on this host could not reach these addresses, and the cause was
# local.** Docker allocates bridge subnets from a built-in pool ending in
# 192.168.0.0/16, reached once 172.17-172.31 are used up; on this machine that
# put a compose network on 192.168.0.0/20, which *contains* 192.168.8.0/24. The
# Docker VM therefore routed every packet for a slave onto a local bridge:
#
#     ip route get 192.168.8.105
#     192.168.8.105 dev br-814c33bb4ef9  src 192.168.0.1
#
# The host itself was unaffected, which is what makes it easy to miss — `curl`
# in a terminal works and the identical `curl` in a container times out.
# `just up` runs `just lanroutes`, which detects this and installs a /32 for
# each provider via the VM's real gateway. Docker Desktop's egress reaches the
# LAN perfectly well once the collision is out of the way.
#
# A Tailscale subnet route is the other way, and sidesteps the collision
# entirely because the route lands in the container's own namespace:
#
#     # on a machine on 192.168.8.0/24, e.g. either Spark
#     sudo tailscale up --advertise-routes=192.168.8.0/24
#     # then approve the route in the Tailscale admin console
#
# `compose.yaml` already passes `--accept-routes`, and a subnet route preserves
# the destination address — the router still dials 192.168.8.105, so the
# profile below stays an accurate description of what it is talking to.
# `just tailnet` lists the routes actually learned.
#
# Do *not* substitute their 100.x tailnet addresses. 100.64.0.0/10 classifies
# as `shared_address_space`, which `EgressProfile::permits` refuses under every
# profile (crates/hypellm-core/src/netaddr.rs) — carrier-grade NAT space is a
# known SSRF pivot and the router denies it outright.

# What is registered below is what was running on 2026-09-30 (probed with
# /v1/models, /props and /slots; inventory in /home/albert/system/spec.md).
# Stopped services are not registered: .105:8000 (Q4 FastMTP), node0's vision
# build and SemIf, the scriptwriter Q3 on .186 and this machine's Q3 on :8200.
# Re-add a provider/target pair when one of them is started again.

provider id=spark2 family=llamacpp scheme=http host=192.168.8.185 port=8000 \
         base_path=/v1 egress=private_network
# The Nemotron llama.cpp server on the same Spark (container
# moneyos-nemotron35-lightning-30b), a separate port and so a separate provider.
provider id=spark2-nemotron family=llamacpp scheme=http host=192.168.8.185 port=8004 \
         base_path=/v1 egress=private_network
# SGLang on the other Spark: OpenAI-compatible and uncredentialed, so the
# llama.cpp family serves it. It is also typellm-rs's backend, so it shares
# its eight slots with that service.
provider id=spark-sglang family=llamacpp scheme=http host=192.168.8.105 port=30000 \
         base_path=/v1 egress=private_network

# `local=true` is load-bearing, not descriptive: a target with no credential
# reference that is not marked local is excluded from every request as
# `credential_scope_mismatch`. A local slave needs no credential.
#
# `concurrency` is the server's slot count (`total_slots` from `/props`, or
# SGLang's configured max running requests) — not a policy preference. Higher
# and the excess queues inside the server where the router cannot see it;
# lower and a slot idles. `context` is the per-slot window from `/slots`.

# Q8_0 FastMTP, one slot, 163,840 tokens, `--reasoning off`; reports vision.
target id=spark2:qwen38-q8 provider=spark2 model=qwen3.8-27b-obliterated-q8-0 local=true \
       aliases=qwen3.8-27b,chat-standard,vision-standard,qwen-any \
       capabilities=chat,vision modalities=text,image \
       reasoning_efforts=low \
       operations=chat,responses streaming=true tools=true json_mode=true structured_output=true \
       context=163840 max_output=32768 quality_class=7 cost=1 \
       concurrency=1 rps=20

# Stock Qwen3.8-27B-FP8 (not OBLITERATED), text only; SGLang context_length 146,432, max_running_requests 8, MTP speculation.
target id=spark-sglang:qwen38-fp8 provider=spark-sglang model=Qwen/Qwen3.8-27B-FP8 local=true \
       aliases=qwen3.8-27b-fp8 \
       capabilities=chat modalities=text \
       operations=chat,responses streaming=true tools=true json_mode=true structured_output=true \
       context=146432 max_output=32768 quality_class=7 cost=1 \
       concurrency=8 rps=20

# Nemotron 3.5 Lightning 30B-A3B Q8_0, four slots of 32,768, text only.
target id=spark2-nemotron:nemotron35-30b provider=spark2-nemotron model=nemotron35-lightning-30b local=true \
       aliases=nemotron35-30b \
       capabilities=chat modalities=text \
       operations=chat,responses streaming=true tools=true json_mode=true structured_output=true \
       context=32768 max_output=8192 quality_class=6 cost=1 \
       concurrency=4 rps=20

alias id=qwen3.8-27b capability=chat targets=spark2:qwen38-q8 \
      description="Qwen3.8 27B OBLITERATED Q8 on spark-ff25"
alias id=chat-standard capability=chat targets=spark2:qwen38-q8,spark-sglang:qwen38-fp8 \
      description="the default chat model"
alias id=vision-standard capability=vision targets=spark2:qwen38-q8 \
      description="images"
alias id=qwen-any capability=chat targets=spark2:qwen38-q8,spark-sglang:qwen38-fp8 \
      description="text or images, routed by modality"
alias id=qwen3.8-27b-fp8 capability=chat targets=spark-sglang:qwen38-fp8 \
      description="stock Qwen3.8 27B FP8 on SGLang (spark-ef2f); 146k context, shared with typellm-rs"
alias id=nemotron35-30b capability=chat targets=spark2-nemotron:nemotron35-30b \
      description="Nemotron 3.5 Lightning 30B-A3B Q8 on spark-ff25; 32k context"

# --- SemIf decision scorers -----------------------------------------------
#
# Not an OpenAI-compatible endpoint and not a chat model. SemIf reads the
# logits of typed option slots in one forward pass and generates nothing, so it
# serves `POST /v1/rerank` and no other operation
# (crates/hypellm-adapters/src/semif.rs). `base_path` is deliberately absent:
# the scorer serves `/score` at the root, not under `/v1`.
#
# Three instances, one per machine. The Sparks reach the LAN directly and their
# scorers are `semif.service` under systemd, enabled, so a reboot returns them
# with nothing for anyone to do. node0's is a WSL process behind the same
# Windows portproxy that publishes 8895 — which is why its port can accept a
# connection while nothing is listening behind it — and it comes back through
# the `HypeLLM fleet up` scheduled task at Windows logon, which also rewrites
# that portproxy from the address WSL was given this boot. A node0 that reboots
# with nobody signing in stays down; the other two cover for it.
provider id=semif-spark family=semif scheme=http host=192.168.8.105 port=8897 \
         egress=private_network
provider id=semif-spark2 family=semif scheme=http host=192.168.8.185 port=8897 \
         egress=private_network

# `concurrency=1` is not a throttle. `serve.py` holds one llama.cpp context
# behind a lock, so a second concurrent request waits *inside* the scorer,
# where the router can neither see it nor time it out. Declaring the truth lets
# admission queue it here instead, and makes three machines three concurrent
# decisions rather than one queue nobody can measure.
#
# `context=16384` is each scorer's `--max-tokens`, which is its prompt cap and
# its llama.cpp window. A longer row is refused by the scorer, so declaring it
# larger would turn an eligibility decision into a 400 after the prompt had
# already crossed the network.
#
# The Sparks run Q6_K and node0 runs Q4_K_M. `quality_class` separates them
# because they are not the same model: a heavier quantisation of the same
# weights produces different logits, and a decision is the one place where
# "close enough" is not a property anyone can check afterwards. The native
# model name rides on every response, so which one answered is never a guess.
target id=semif-spark:qwen35-4b provider=semif-spark model=Qwen3.5-4B-Q6_K \
       local=true aliases=decide \
       capabilities=rerank operations=rerank modalities=text \
       streaming=false tools=false json_mode=false \
       context=16384 max_output=1 quality_class=6 cost=1 \
       concurrency=1 rps=20
target id=semif-spark2:qwen35-4b provider=semif-spark2 model=Qwen3.5-4B-Q6_K \
       local=true aliases=decide \
       capabilities=rerank operations=rerank modalities=text \
       streaming=false tools=false json_mode=false \
       context=16384 max_output=1 quality_class=6 cost=1 \
       concurrency=1 rps=20

alias id=decide capability=rerank \
      targets=semif-spark:qwen35-4b,semif-spark2:qwen35-4b \
      description="SemIf option scoring; POST /v1/rerank, 2-16 documents"

# Without a queue a second concurrent call is refused outright: six concurrent
# calls against a single-slot pair produced four `capacity_exhausted` refusals
# and two answers. A scoring call is sub-second on an idle scorer, so a short
# wait is what a caller wants; `queued` turns the refusal into one, bounded by
# `settings queue_timeout_ms` and by what is left of the request deadline.
quota scope=target:semif-spark:qwen35-4b concurrency=1 queued=8 class=interactive
quota scope=target:semif-spark2:qwen35-4b concurrency=1 queued=8 class=interactive

grant scope=tenant:local model=* allow=true
# `prefer` is a ranked list, and it is also the selector: a target no binding names is
# excluded as `not_selected_by_any_binding` however many aliases list it. Naming only the
# first Spark left the second idle through 165 consecutive exclusions, so the fleet's
# capacity was one machine's three slots and a saturated node had no failover.
#
# Naming them *in order* was the next mistake, and a quieter one. Position in `prefer`
# becomes the rank, and `ScoreTerms::RANK_UNIT` is 1,000,000 precisely so that a better
# rank beats every other term combined — the queue penalty saturates at -50,000. A rank-0
# Spark therefore outscores a rank-1 Spark by a margin no amount of load can close, and
# the second machine received work only when the first was *filtered out* by
# `has_capacity`. Over 40 hours that was 4,506 requests to `spark` and 43 to `spark2`.
#
# `*` is `TargetSelector::Any`, so both Sparks take rank 0 from one entry and the tie
# falls to the non-rank terms. They are identical in locality, cost and capability, so
# what actually decides is the queue penalty — in-flight over `concurrency`, scaled — and
# the latency penalty. That is least-loaded routing, and it is the scoring model working
# as designed rather than a new mechanism bolted onto it.
#
# `*` selecting a future target is not the widening it looks like: the alias is the
# eligibility filter, and a target no alias names is never a candidate to rank.
binding id=local-default scope=tenant:local model=* prefer=*

# The break-glass principal signs in on the admin application's sign-in screen
# ("Use break-glass access", revealed automatically because Google sign-in
# answers not_found here), or through POST /admin/v1/auth/break-glass directly.
# It is not the only way in — the `local_user` account above signs in with a
# password — but it is the only credential here that carries `manage_keys`, so
# `just key` goes through it.
role_binding subject=principal:operator role=break_glass_admin
