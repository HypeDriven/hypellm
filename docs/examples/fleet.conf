# HypeLLM Router — the five-host fleet, as configured.
#
# A working example, modelled on a real five-host fleet: two ARM64 DGX Spark
# machines with unified memory, an x86-64 box carrying two very different GPUs,
# an RTX 5090 running unrelated production services, and a large-disk host used
# as an artifact cache.
#
# Addresses and accounts are placeholders; the memory figures, timings and
# governance choices are not. It is here to be read as well as used, and every
# number below is either measured on that hardware or a deliberate choice — the
# ones that are choices say so.
#
# Validate it before activating it:
#
#     cargo run -p hypellm-router -- --check --config docs/examples/fleet.conf
#
# and confirm the agent agrees about what the identifiers mean:
#
#     agent/fleet-agent --config agent/fleet.example.json --print-digest
#     cargo run -q -p hypellm-router -- --check --config docs/examples/fleet.conf
#
# The two digests must match. They are computed independently from two
# different files, which is the point: a router and an agent that disagree
# about what `spark-music3` means must not act on that disagreement.

settings \
    inference_listen=127.0.0.1:8080 \
    admin_listen=127.0.0.1:8081 \
    state_dir=/var/lib/hypellm \
    fleet_enabled=true \
    max_documents_per_request=4 \
    default_document_token_estimate=4096 \
    activation_effort_headroom_ms=5000 \
    weighted_tie_break=true \
    allow_generic_adapter=true
#   ^ Required for the two Gradio services below. Specification 25 keeps the
#     generic adapter off by default and demands a fixed endpoint and explicit
#     capabilities; both are declared, and both targets are `state=maintenance`
#     until an OpenAI-compatible shim exists.

tenant id=hypedriven residency=uk

credential id=cred_none scope=tenant:hypedriven description="unused; the fleet is on a private network"

# -- Providers -------------------------------------------------------------
#
# Every slave speaks plain HTTP on the LAN. `egress=private_network` is what
# permits that: cleartext is refused to anything but loopback *unless* the
# address classifies as private and an administrator declared this profile.
# The cost is stated rather than hidden — traffic to a slave is unencrypted on
# the operator's own network, and `docs/deferred-issues.md` records it.

provider id=spark family=llamacpp scheme=http host=10.0.0.105 port=8000 \
    base_path=/v1 egress=private_network
provider id=spark2 family=llamacpp scheme=http host=10.0.0.185 port=8000 \
    base_path=/v1 egress=private_network
provider id=node0 family=llamacpp scheme=http host=10.0.0.182 port=8895 \
    base_path=/v1 egress=private_network

# The two Gradio services on the Spark. They are declared so the router can
# *account for their memory and start and stop them*; they are not declared as
# routable, because neither speaks an OpenAI-compatible API yet. See the
# `state=maintenance` note on their targets below.
provider id=spark-gradio family=generic_openai scheme=http host=10.0.0.105 \
    port=7861 base_path=/v1 egress=private_network

# -- Targets ---------------------------------------------------------------
#
# `local=true` on every one of these: specification 6.3's locality term and the
# `require_local` hint both mean "inference did not leave this deployment", and
# a model on the operator's own LAN satisfies that. It is not a claim about the
# process being on this host.

target id=spark:qwen38-q5 provider=spark model=qwen38-27b-mtp \
    aliases=qwen3.8-27b,chat-standard capabilities=chat modalities=text \
    reasoning_efforts=minimal,low,medium,high \
    operations=chat,responses streaming=true tools=true json_mode=true \
    context=131072 max_output=32768 quality_class=7 cost=1 local=true \
    concurrency=4 rps=20

target id=spark2:qwen38-q5 provider=spark2 model=qwen38-27b-mtp \
    aliases=qwen3.8-27b,chat-standard capabilities=chat modalities=text \
    reasoning_efforts=minimal,low,medium,high \
    operations=chat,responses streaming=true tools=true json_mode=true \
    context=131072 max_output=32768 quality_class=7 cost=1 local=true \
    concurrency=4 rps=20

# The fleet's only vision model, on `device=1` — the GTX 1080 Ti, not the GT
# 1030 beside it. Placement targets the accelerator, which is why the two are
# declared separately below.
target id=node0:qwen35-9b-vision provider=node0 model=qwen35-9b-vision \
    aliases=vision-standard,qwen-any capabilities=chat,vision,document \
    modalities=text,image,document operations=chat streaming=true \
    context=32768 max_output=8192 quality_class=5 cost=1 local=true \
    document_token_estimate=3072 concurrency=2 rps=10

# Declared, accounted for, and deliberately not routable. `state=maintenance`
# excludes them from every routing decision while leaving their deployments
# real: the planner still knows they hold 48 GiB and 64 GiB of the Spark's
# unified memory, and an operator can still start and stop them from the Fleet
# screen. Remove `state=maintenance` once an OpenAI-compatible shim is in front
# of the Gradio API.
target id=spark:minimax-music3 provider=spark-gradio model=minimax-music3 \
    aliases=music-standard capabilities=text-to-music modalities=text \
    operations=chat context=4096 max_output=4096 local=true \
    state=maintenance concurrency=1 rps=2
target id=spark:minimax-h3 provider=spark-gradio model=minimax-h3 \
    aliases=h3-standard capabilities=audio-to-video modalities=text,audio \
    operations=chat context=4096 max_output=4096 local=true \
    state=maintenance concurrency=1 rps=2

# -- Aliases ---------------------------------------------------------------
#
# Named after models, which is the guidance worth following: a client sends
# `"model": "qwen3.8-27b"` — model-centric, works unmodified with any OpenAI
# harness — while the router chooses between two Sparks under policy. Host
# selection is not a routing dimension; it falls out of alias→target ranking,
# now informed by which host already has the model resident.

alias id=qwen3.8-27b capability=chat targets=spark:qwen38-q5,spark2:qwen38-q5 \
    description="Qwen3.8 27B, whichever Spark is warm"
alias id=chat-standard capability=chat targets=spark:qwen38-q5,spark2:qwen38-q5 \
    description="the default chat model"
alias id=vision-standard capability=vision targets=node0:qwen35-9b-vision \
    description="images and documents"
# One alias serving both: modality is a filter, so text goes to the big model
# and a document goes to the vision model, and the caller never has to know.
alias id=qwen-any capability=chat targets=node0:qwen35-9b-vision \
    description="text or documents, routed by modality"
alias id=music-standard capability=text-to-music targets=spark:minimax-music3
alias id=h3-standard capability=audio-to-video targets=spark:minimax-h3

grant scope=tenant:hypedriven allow=true
binding id=default scope=tenant:hypedriven prefer=spark:qwen38-q5 weight=100

# -- The fleet -------------------------------------------------------------

fleet_agent id=local socket="/run/hypellm/fleet.sock" \
    observation_interval_ms=5000 observation_max_age_ms=30000 \
    request_timeout_ms=10000

# The Sparks. Unified memory is shared with the host, so the accelerator and
# the host share a pool and the reservation must be generous: 124,610 MiB is
# what `nvidia-smi` reports, and the operating system, the container runtime,
# and everything else on the machine come out of the same pool.
host id=spark agent=local arch=aarch64 status=enabled \
    reserved_memory_bytes=17179869184 max_concurrent_activations=1
accelerator host=spark id=spark-gb10 kind=unified pool=spark-unified \
    memory_bytes=130673213440

host id=spark2 agent=local arch=aarch64 status=enabled \
    reserved_memory_bytes=17179869184 max_concurrent_activations=1
accelerator host=spark2 id=spark2-gb10 kind=unified pool=spark2-unified \
    memory_bytes=130673213440

# Two accelerators of very different capability. Only one is useful, and
# placement names it: `node0-gtx1080ti`, not "the host".
host id=node0 agent=local arch=x86_64 status=enabled \
    reserved_memory_bytes=0 max_concurrent_activations=1
accelerator host=node0 id=node0-gt1030 kind=cuda memory_bytes=4294967296
accelerator host=node0 id=node0-gtx1080ti kind=cuda memory_bytes=11811160064

# The RTX 5090 also runs unrelated production services. Declared so its memory
# is accounted for; nothing is placed on it here, and anything that ever is
# should carry `evictable=false`.
host id=rtx5090 agent=local arch=x86_64 status=maintenance \
    reserved_memory_bytes=8589934592 max_concurrent_activations=1
accelerator host=rtx5090 id=rtx5090-0 kind=cuda memory_bytes=34188427264

# The artifact cache: a Threadripper with 5.9 TB free and no serious
# accelerator. Not an inference target, and `status=drain` says so — resident
# work keeps serving, nothing new is placed.
host id=cache agent=local arch=x86_64 status=drain \
    reserved_memory_bytes=0 max_concurrent_activations=1
accelerator host=cache id=cache-gt1030 kind=cuda memory_bytes=2147483648

# -- Deployments -----------------------------------------------------------
#
# `start_ms` is not a formality: a 20 GB Q5 GGUF with a speculative-decoding
# sidecar takes minutes to become ready, and every planning decision is
# dominated by that number.

deployment id=spark-qwen38 target=spark:qwen38-q5 accelerator=spark-gb10 \
    memory_bytes=27917287424 \
    start_ms=180000 stop_ms=15000 drain_ms=30000 probe_ms=20000 \
    readiness=inference min_resident_ms=600000 \
    evictable=false pinned=true autostart=true retention_weight=50000
#   ^ The chat model every coding harness depends on. Pinned and not evictable:
#     the planner is not asked to be clever about something the operator has
#     already decided.

deployment id=spark2-qwen38 target=spark2:qwen38-q5 accelerator=spark2-gb10 \
    memory_bytes=27917287424 \
    start_ms=180000 stop_ms=15000 drain_ms=30000 probe_ms=20000 \
    readiness=inference min_resident_ms=300000 \
    evictable=true pinned=false autostart=true

deployment id=node0-vision target=node0:qwen35-9b-vision \
    accelerator=node0-gtx1080ti memory_bytes=10737418240 \
    start_ms=90000 stop_ms=10000 drain_ms=20000 probe_ms=15000 \
    readiness=http_ok min_resident_ms=300000 autostart=true

deployment id=spark-music3 target=spark:minimax-music3 accelerator=spark-gb10 \
    memory_bytes=68719476736 \
    start_ms=180000 stop_ms=15000 drain_ms=30000 probe_ms=10000 \
    readiness=http_ok min_resident_ms=600000 evictable=true autostart=false

deployment id=spark-h3 target=spark:minimax-h3 accelerator=spark-gb10 \
    memory_bytes=51539607552 \
    start_ms=150000 stop_ms=15000 drain_ms=30000 probe_ms=10000 \
    readiness=http_ok min_resident_ms=600000 evictable=true autostart=false

# -- Governance ------------------------------------------------------------
#
# The defaults are chosen together: a five-minute dwell floor and twelve
# activations an hour bound the worst case at twelve swaps per host per hour
# whatever demand does. Raising one without the other is how a fleet ends up
# spending its afternoon loading models.

fleet_policy scope=fleet max_activations_per_hour=12 \
    eviction_margin_permille=250 max_eviction_set=2 \
    activation_min_demand=1 activation_max_wait_ms=20000 \
    reactivation_cooldown_ms=120000 allow_fetch=false

# The Spark is where the contention is: three large models, and room for two.
# A longer dwell floor there costs a little responsiveness and buys a lot of
# throughput, because each swap costs three minutes.
fleet_policy scope=host:spark max_activations_per_hour=6 \
    eviction_margin_permille=400 max_eviction_set=1 \
    reactivation_cooldown_ms=300000
