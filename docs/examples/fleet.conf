# HypeLLM Router — the two-Spark fleet, as configured.
#
# Two ARM64 DGX Spark machines with unified memory, each serving Qwen3.8 27B.
# Nothing else: the x86-64 box with the two mismatched GPUs, the RTX 5090
# running unrelated production services, and the large-disk artifact-cache host
# have been removed rather than left declared and disabled.
#
# Addresses and accounts are placeholders; the concurrency, memory figures,
# timings and governance choices are not. It is here to be read as well as
# used, and every number below is either measured on that hardware or a
# deliberate choice — the ones that are choices say so.
#
# Validate it before activating it:
#
#     cargo run -p hypellm-router -- --check --config docs/examples/fleet.conf
#
# and confirm the agent agrees about what the identifiers mean:
#
#     agent/fleet-agent --config agent/fleet.example.json --print-digest
#     cargo run -q -p hypellm-router -- --check --config docs/examples/fleet.conf
#
# The two digests must match. They are computed independently from two
# different files, which is the point: a router and an agent that disagree
# about what `spark-qwen38` means must not act on that disagreement. Removing a
# host from one file and not the other changes one digest and not the other,
# and the router then issues no mutating verb for *any* target — so the two
# files are edited together or not at all.

settings \
    inference_listen=127.0.0.1:8080 \
    admin_listen=127.0.0.1:8081 \
    state_dir=/var/lib/hypellm \
    fleet_enabled=true \
    activation_effort_headroom_ms=5000 \
    weighted_tie_break=true
#   ^ `allow_generic_adapter` is gone with the Gradio services it existed for.
#     Specification 25 keeps the generic adapter off by default; leaving it on
#     with nothing using it widens what a configuration mistake can reach, for
#     no benefit. The document settings went the same way — no target declares
#     the document modality any more, so they governed nothing.

tenant id=hypedriven residency=uk

# -- Providers -------------------------------------------------------------
#
# Both Sparks speak plain HTTP on the LAN. `egress=private_network` is what
# permits that: cleartext is refused to anything but loopback *unless* the
# address classifies as private and an administrator declared this profile.
# The cost is stated rather than hidden — traffic to a slave is unencrypted on
# the operator's own network, and `docs/deferred-issues.md` records it.

provider id=spark family=llamacpp scheme=http host=10.0.0.105 port=8000 \
    base_path=/v1 egress=private_network
provider id=spark2 family=llamacpp scheme=http host=10.0.0.185 port=8000 \
    base_path=/v1 egress=private_network

# -- Targets ---------------------------------------------------------------
#
# `local=true` on both: specification 6.3's locality term and the
# `require_local` hint both mean "inference did not leave this deployment", and
# a model on the operator's own LAN satisfies that. It is not a claim about the
# process being on this host.
#
# `concurrency=3` is not a guess and not a policy preference: it is llama.cpp's
# `--parallel`, reported as `total_slots` by `GET /props` on each Spark.
# Measured, not assumed:
#
#     curl -s http://<slave>:8000/props | jq .total_slots   # 3
#
# The two numbers have to agree. Set it higher and the excess requests queue
# *inside* llama.cpp, where the router cannot see them: they consume no
# admission slot, appear as latency rather than as queue depth, and ignore the
# deadline and backpressure the router would otherwise apply. Set it lower and
# a slot sits idle. Matching means the queue forms in the one place that
# measures it and can shed it. Re-check it whenever a slave's launch flags
# change — this is a property of how the server was started, not of the model.
#
# Vision is declared because both Sparks serve it. That was not always true —
# these deployments used to run without the vision projector to protect unified
# memory — so it is worth recording how it was checked rather than assumed:
#
#     curl -s http://<slave>:8000/props | jq .modalities
#     # {"vision": true, "video": true, "audio": false}
#
# and then confirmed end to end, because `/props` describes what was loaded and
# not what works: an 8x8 solid-red PNG sent as an `image_url` content part, to
# which both answered "Red".
#
# `capabilities=chat,vision` and `modalities=text,image` are two different
# filters and both are needed. The capability is the verb an alias asks for
# (`vision-standard` below declares `capability=vision`); the modality is what
# the caller is sending. A target missing either is excluded.
#
# `document` is deliberately **not** declared, and with node0 gone nothing in
# this fleet declares it. A document is forwarded opaquely and llama.cpp has no
# path for one; claiming it here would route documents to a target that cannot
# read them. Requests carrying one are refused with `modality_unsupported`
# before anything is dialled, which is the capability contract working.

target id=spark:qwen38-q5 provider=spark model=qwen38-27b-mtp \
    aliases=qwen3.8-27b,chat-standard,vision-standard,qwen-any \
    capabilities=chat,vision modalities=text,image \
    reasoning_efforts=minimal,low,medium,high \
    operations=chat,responses streaming=true tools=true json_mode=true \
    context=131072 max_output=32768 quality_class=7 cost=1 local=true \
    concurrency=3 rps=20

target id=spark2:qwen38-q5 provider=spark2 model=qwen38-27b-mtp \
    aliases=qwen3.8-27b,chat-standard,vision-standard,qwen-any \
    capabilities=chat,vision modalities=text,image \
    reasoning_efforts=minimal,low,medium,high \
    operations=chat,responses streaming=true tools=true json_mode=true \
    context=131072 max_output=32768 quality_class=7 cost=1 local=true \
    concurrency=3 rps=20

# -- Aliases ---------------------------------------------------------------
#
# Named after models, which is the guidance worth following: a client sends
# `"model": "qwen3.8-27b"` — model-centric, works unmodified with any OpenAI
# harness — while the router chooses between two Sparks under policy. Host
# selection is not a routing dimension; it falls out of alias→target ranking,
# informed by which host already has the model resident.

alias id=qwen3.8-27b capability=chat targets=spark:qwen38-q5,spark2:qwen38-q5 \
    description="Qwen3.8 27B, whichever Spark is warm"
alias id=chat-standard capability=chat targets=spark:qwen38-q5,spark2:qwen38-q5 \
    description="the default chat model"
alias id=vision-standard capability=vision targets=spark:qwen38-q5,spark2:qwen38-q5 \
    description="images"
# One alias serving both: modality is a filter, so text and images both go to
# whichever Spark is warm and the caller never has to know.
alias id=qwen-any capability=chat targets=spark:qwen38-q5,spark2:qwen38-q5 \
    description="text or images, routed by modality"

grant scope=tenant:hypedriven allow=true
binding id=default scope=tenant:hypedriven prefer=spark:qwen38-q5 weight=100

# -- The fleet -------------------------------------------------------------

fleet_agent id=local socket="/run/hypellm/fleet.sock" \
    observation_interval_ms=5000 observation_max_age_ms=30000 \
    request_timeout_ms=10000

# The Sparks. Unified memory is shared with the host, so the accelerator and
# the host share a pool and the reservation must be generous: 124,610 MiB is
# what `nvidia-smi` reports, and the operating system, the container runtime,
# and everything else on the machine come out of the same pool.
host id=spark agent=local arch=aarch64 status=enabled \
    reserved_memory_bytes=17179869184 max_concurrent_activations=1
accelerator host=spark id=spark-gb10 kind=unified pool=spark-unified \
    memory_bytes=130673213440

host id=spark2 agent=local arch=aarch64 status=enabled \
    reserved_memory_bytes=17179869184 max_concurrent_activations=1
accelerator host=spark2 id=spark2-gb10 kind=unified pool=spark2-unified \
    memory_bytes=130673213440

# -- Deployments -----------------------------------------------------------
#
# `start_ms` is not a formality: a 20 GB Q5 GGUF with a speculative-decoding
# sidecar takes minutes to become ready, and every planning decision is
# dominated by that number.

deployment id=spark-qwen38 target=spark:qwen38-q5 accelerator=spark-gb10 \
    memory_bytes=27917287424 \
    start_ms=180000 stop_ms=15000 drain_ms=30000 probe_ms=20000 \
    readiness=inference min_resident_ms=600000 \
    evictable=false pinned=true autostart=true retention_weight=50000
#   ^ The chat model every coding harness depends on. Pinned and not evictable:
#     the planner is not asked to be clever about something the operator has
#     already decided.

deployment id=spark2-qwen38 target=spark2:qwen38-q5 accelerator=spark2-gb10 \
    memory_bytes=27917287424 \
    start_ms=180000 stop_ms=15000 drain_ms=30000 probe_ms=20000 \
    readiness=inference min_resident_ms=300000 \
    evictable=true pinned=false autostart=true

# -- Governance ------------------------------------------------------------
#
# The defaults are chosen together: a five-minute dwell floor and twelve
# activations an hour bound the worst case at twelve swaps per host per hour
# whatever demand does. Raising one without the other is how a fleet ends up
# spending its afternoon loading models.

fleet_policy scope=fleet max_activations_per_hour=12 \
    eviction_margin_permille=250 max_eviction_set=2 \
    activation_min_demand=1 activation_max_wait_ms=20000 \
    reactivation_cooldown_ms=120000 allow_fetch=false

# One model per Spark now that the Gradio services are gone, so the contention
# these tighter limits were written for no longer exists. They are kept because
# a swap on this hardware still costs three minutes, and `spark-qwen38` is
# `pinned=true evictable=false` — the limits should never bind, and if they
# ever do, something is wrong and a slower reaction is the safer one.
fleet_policy scope=host:spark max_activations_per_hour=6 \
    eviction_margin_permille=400 max_eviction_set=1 \
    reactivation_cooldown_ms=300000
